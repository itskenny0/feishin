# Builds Linux/macOS/Windows packages for a `v*-itskenny0-*` tag and uploads
# every individual artifact to a GitHub Release for that tag. Older tags
# using the legacy `v*-itskenny-*` prefix still trigger the workflow so
# historical builds remain reproducible.
#
# Trigger: push a tag like `v1.11.0-itskenny0-2026.05.10a` to this fork.
# Re-trigger via the Actions UI ("Run workflow") with an existing tag name.
name: Release (fork)

on:
    push:
        tags:
            - 'v*-itskenny0-*'
            - 'v*-itskenny-*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to (re-)build a release for'
                required: true
                type: string
            prerelease:
                description: 'Mark as prerelease'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-fork-${{ github.event.inputs.tag || github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        if: github.repository == 'itskenny0/feishin'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            packageVersion: ${{ steps.tag.outputs.packageVersion }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Resolve tag and derive artifact version
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      tag="${{ github.event.inputs.tag }}"
                  else
                      tag="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

                  # Strip the leading semver (e.g. v1.11.0-) so we are left
                  # with the fork-specific suffix (e.g. itskenny0-2026.05.10a).
                  rawSuffix="${tag#v*.*.*-}"

                  # Replace dots in the suffix with dashes so the final string
                  # is a valid semver prerelease (numeric segments cannot have
                  # leading zeros, but alphanumeric-with-dashes identifiers can
                  # contain anything in [0-9A-Za-z-]). 2026.05.10a → 2026-05-10a.
                  sanitizedSuffix="${rawSuffix//./-}"

                  baseVersion="$(node -p "require('./package.json').version")"
                  if [ "${rawSuffix}" != "${tag}" ] && [ -n "${rawSuffix}" ]; then
                      packageVersion="${baseVersion}-${sanitizedSuffix}"
                  else
                      packageVersion="${baseVersion}"
                  fi
                  echo "packageVersion=${packageVersion}" >> "$GITHUB_OUTPUT"
                  echo "Using artifact version: ${packageVersion}"

    create-release:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ needs.prepare.outputs.tag }}
            - name: Create release if missing
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
                  PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists — skipping create."
                      exit 0
                  fi
                  flags=()
                  if [ "$PRERELEASE" = "true" ]; then
                      flags+=(--prerelease)
                  fi
                  gh release create "$TAG" \
                      --title "Feishin $TAG" \
                      --generate-notes \
                      --target "$(git rev-parse HEAD)" \
                      "${flags[@]}"

    linux:
        needs: [prepare, create-release]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Set artifact version
              run: npm pkg set version="${{ needs.prepare.outputs.packageVersion }}"
            - name: Package x64
              run: pnpm run package:linux:pr
            - name: Package arm64
              run: pnpm run package:linux-arm64:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  gh release upload "$TAG" \
                      dist/*.AppImage \
                      dist/*.deb \
                      dist/*.tar.xz \
                      --clobber

    windows:
        needs: [prepare, create-release]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Set artifact version
              shell: bash
              run: npm pkg set version="${{ needs.prepare.outputs.packageVersion }}"
            - name: Package x64
              run: pnpm run package:win:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              shell: bash
              run: |
                  gh release upload "$TAG" \
                      dist/*.exe \
                      dist/*.zip \
                      --clobber

    macos:
        needs: [prepare, create-release]
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Set artifact version
              run: npm pkg set version="${{ needs.prepare.outputs.packageVersion }}"
            - name: Package
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm run package:mac:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  gh release upload "$TAG" \
                      dist/*.dmg \
                      dist/*.zip \
                      --clobber

# Builds Linux/macOS/Windows packages for a `v*-itskenny-*` tag and uploads
# every individual artifact to a GitHub Release for that tag.
#
# Trigger: push a tag like `v1.11.0-itskenny-2026.05.05` to this fork.
# Re-trigger via the Actions UI ("Run workflow") with an existing tag name.
name: Release (fork)

on:
    push:
        tags:
            - 'v*-itskenny-*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to (re-)build a release for'
                required: true
                type: string
            prerelease:
                description: 'Mark as prerelease'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-fork-${{ github.event.inputs.tag || github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        if: github.repository == 'itskenny0/feishin'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
        steps:
            - name: Resolve tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

    create-release:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ needs.prepare.outputs.tag }}
            - name: Create release if missing
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
                  PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists — skipping create."
                      exit 0
                  fi
                  flags=()
                  if [ "$PRERELEASE" = "true" ]; then
                      flags+=(--prerelease)
                  fi
                  gh release create "$TAG" \
                      --title "Feishin $TAG" \
                      --generate-notes \
                      --target "$(git rev-parse HEAD)" \
                      "${flags[@]}"

    linux:
        needs: [prepare, create-release]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Package x64
              run: pnpm run package:linux:pr
            - name: Package arm64
              run: pnpm run package:linux-arm64:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  gh release upload "$TAG" \
                      dist/*.AppImage \
                      dist/*.deb \
                      dist/*.tar.xz \
                      --clobber

    windows:
        needs: [prepare, create-release]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Package x64
              run: pnpm run package:win:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              shell: bash
              run: |
                  gh release upload "$TAG" \
                      dist/*.exe \
                      dist/*.zip \
                      --clobber

    macos:
        needs: [prepare, create-release]
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install
            - name: Package
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm run package:mac:pr
            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  gh release upload "$TAG" \
                      dist/*.dmg \
                      dist/*.zip \
                      --clobber

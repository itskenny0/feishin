# Builds an unsigned Android debug APK for a `v*-itskenny0-*` tag and uploads
# it to the matching GitHub Release. The APK wraps the existing `pnpm
# build:web` output via Capacitor — see ANDROID.md for the design overview
# and known limitations.
#
# Trigger: push a tag like `v1.11.0-itskenny0-2026.05.20a` to this fork.
# Re-trigger via the Actions UI ("Run workflow") with an existing tag name.
name: Release Android (fork)

on:
    push:
        tags:
            - 'v*-itskenny0-*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing git tag to (re-)build the Android APK for'
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-android-${{ github.event.inputs.tag || github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        if: github.repository == 'itskenny0/feishin'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            packageVersion: ${{ steps.tag.outputs.packageVersion }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Resolve tag and derive artifact version
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      tag="${{ github.event.inputs.tag }}"
                  else
                      tag="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

                  # Strip the leading semver so we are left with the
                  # fork-specific suffix (e.g. itskenny0-2026.05.20a).
                  rawSuffix="${tag#v*.*.*-}"
                  sanitizedSuffix="${rawSuffix//./-}"

                  baseVersion="$(node -p "require('./package.json').version")"
                  if [ "${rawSuffix}" != "${tag}" ] && [ -n "${rawSuffix}" ]; then
                      packageVersion="${baseVersion}-${sanitizedSuffix}"
                  else
                      packageVersion="${baseVersion}"
                  fi
                  echo "packageVersion=${packageVersion}" >> "$GITHUB_OUTPUT"
                  echo "Using artifact version: ${packageVersion}"

    android:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  # Capacitor 8's Android module compiles with sourceCompatibility 21,
                  # so the runner needs Temurin 21 — JDK 17 fails at
                  # :capacitor-android:compileDebugJavaWithJavac with
                  # 'invalid source release: 21'.
                  java-version: '21'
            - uses: android-actions/setup-android@v3
            - uses: gradle/actions/setup-gradle@v3
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Set artifact version
              run: npm pkg set version="${{ needs.prepare.outputs.packageVersion }}"
            - name: Build web bundle
              run: pnpm build:web
            - name: Generate stub settings.js
              # settings.js.template is the Docker-deploy runtime-config file;
              # an APK ships it statically. envsubst with no env set replaces
              # every ${VAR} with an empty string, which the renderer
              # tolerates (every read site falls back to a sensible default).
              # Without this file the WebView shows index.html's 404 in the
              # console; the bundle still boots, but it's noise we don't need.
              run: envsubst < settings.js.template > out/web/settings.js
            - name: Sync Capacitor android project
              run: npx cap sync android
            - name: Assemble debug APK
              working-directory: android
              run: ./gradlew assembleDebug --no-daemon
            - name: Rename APK with version
              id: apk
              run: |
                  src="android/app/build/outputs/apk/debug/app-debug.apk"
                  dst="dist/feishin-${{ needs.prepare.outputs.packageVersion }}-android.apk"
                  mkdir -p dist
                  cp "$src" "$dst"
                  echo "path=$dst" >> "$GITHUB_OUTPUT"
            - name: Ensure release exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  # Poll briefly for an existing release — the parallel
                  # desktop "Release (fork)" workflow creates the same
                  # GitHub Release for the same tag, and the bare
                  # view-then-create check below would race with it and
                  # error out 422 "already exists". Up to ~30s of polling
                  # lets the desktop job win the race cleanly.
                  for i in $(seq 1 15); do
                      if gh release view "$TAG" >/dev/null 2>&1; then
                          exit 0
                      fi
                      sleep 2
                  done
                  # Still missing — create it ourselves but swallow the
                  # "already exists" 422 in case the other job pipped us
                  # at the last possible moment.
                  if ! gh release create "$TAG" \
                      --title "Feishin $TAG" \
                      --generate-notes \
                      --target "$(git rev-parse HEAD)" 2>&1 | tee /tmp/gh-out; then
                      if grep -q "already_exists\|already exists" /tmp/gh-out; then
                          echo "Release was created concurrently — continuing."
                          exit 0
                      fi
                      exit 1
                  fi
            - name: Upload APK to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.tag }}
              run: |
                  gh release upload "$TAG" \
                      "${{ steps.apk.outputs.path }}" \
                      --clobber

<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <!--
            maximum-scale=1 + user-scalable=no disables the browser's
            pinch-to-zoom gesture. Feishin doesn't use pinch anywhere
            (no maps, no images that warrant zoom), and the partial
            scaling that was leaking through on Android made the
            mobile layout look broken — half-scaled text, controls
            sliding under the safe-area inset, etc. The viewport-fit:
            cover stays for safe-area handling on notched devices.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <title>Feishin</title>
        <% if (web) { %>
        <link rel="icon" href="./assets/favicon.ico" />
        <script src="settings.js"></script>
        <% } %>
        <script>
            (function () {
                if (localStorage.getItem('umami.disabled') === '0' && window.ANALYTICS_DISABLED !== true && window.ANALYTICS_DISABLED !== 'true') {
                    var s = document.createElement('script');
                    s.defer = true;
                    s.src = 'https://umami.jeffvli.org/script.js';
                    s.setAttribute('data-website-id', '5120fc56-cffa-4d42-8b6c-9afb6f459251');
                    s.setAttribute('data-exclude-search', 'true');
                    s.setAttribute('data-exclude-hash', 'true');
                    s.setAttribute('data-auto-track', 'false');
                    document.head.appendChild(s);
                }
            })();
        </script>
    </head>

    <body style="background-color: #000">
        <% if (web) { %>
        <!-- Boot-error overlay: makes runtime crashes visible without
             devtools. Useful when debugging an Android APK on a tablet
             that hasn't been hooked up via chrome://inspect yet. The
             whole block is web-only — the Electron build doesn't need
             it because it has F12 and Sentry-style instrumentation.

             Two important properties to preserve:
             1. The overlay is ONLY active until React has mounted into
                #root. Once createRoot() flushes, the overlay closes and
                stops accepting new errors so a single later scrobble
                failure (or any other post-boot rejection) doesn't slap a
                red full-screen panel over a working app — that was the
                bug in v20j where the entire UI looked black with only
                error lines visible.
             2. The overlay is tap-to-dismiss as a fallback, so even if a
                pre-mount error fires the user can clear it manually. -->
        <div id="boot-error-overlay" style="display:none;position:fixed;inset:0;z-index:99999;padding:20px;background:#1a0000;color:#ff8a80;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;line-height:1.45;overflow:auto;white-space:pre-wrap;word-break:break-word;cursor:pointer;"></div>
        <script>
            (function () {
                var overlay = document.getElementById('boot-error-overlay');
                var lines = [];
                // Once React has mounted we stop intercepting events.
                // `disabled` flips to true on first observed render so
                // post-boot rejections don't resurrect the overlay.
                var disabled = false;
                function show(label, info) {
                    if (disabled) return;
                    var stamp = new Date().toISOString().slice(11, 23);
                    lines.push('[' + stamp + '] ' + label + ': ' + info);
                    overlay.textContent =
                        lines.join('\n\n') +
                        '\n\n— Tap anywhere to dismiss this overlay —';
                    overlay.style.display = 'block';
                }
                function hide() {
                    overlay.style.display = 'none';
                    overlay.textContent = '';
                    lines = [];
                    disabled = true;
                }
                overlay.addEventListener('click', hide);
                var onError = function (e) {
                    if (e.target && e.target !== window && e.target.tagName) {
                        var src = e.target.src || e.target.href || '(no src)';
                        show('RESOURCE LOAD FAILED', e.target.tagName + ' :: ' + src);
                        return;
                    }
                    var msg = (e.error && (e.error.stack || e.error.message)) || e.message || String(e);
                    show('ERROR', msg);
                };
                var onRejection = function (e) {
                    var reason = e.reason;
                    var msg =
                        (reason && (reason.stack || reason.message)) || String(reason);
                    show('UNHANDLED REJECTION', msg);
                };
                window.addEventListener('error', onError, true);
                window.addEventListener('unhandledrejection', onRejection);

                // Poll for React mount. As soon as #root has a child node
                // we know createRoot has run and the rest of the app is
                // the right place to surface errors (toasts, etc.). The
                // overlay disables itself AND detaches the global listeners
                // so post-boot rejections never accumulate handlers (dev
                // HMR re-runs this script repeatedly) and never trap
                // reason strings that may include broker credentials.
                var mountInterval = setInterval(function () {
                    var root = document.getElementById('root');
                    if (root && root.childNodes.length > 0) {
                        // If the overlay is currently showing (a pre-mount
                        // error happened), leave it visible so the user can
                        // still read what went wrong — they can tap to
                        // dismiss. We only stop *accepting new errors*.
                        disabled = true;
                        window.removeEventListener('error', onError, true);
                        window.removeEventListener('unhandledrejection', onRejection);
                        clearInterval(mountInterval);
                    }
                }, 100);

                // If React hasn't mounted into #root after 5s, dump a
                // diagnostic block so we know the bundle never reached
                // createRoot(). The page is black until then anyway, so
                // overwriting the empty root with the overlay is harmless.
                setTimeout(function () {
                    var root = document.getElementById('root');
                    if (root && root.childNodes.length === 0) {
                        show(
                            'BOOT TIMEOUT',
                            'React did not mount within 5 s.\n' +
                                '  href:         ' + location.href + '\n' +
                                '  origin:       ' + location.origin + '\n' +
                                '  userAgent:    ' + navigator.userAgent + '\n' +
                                '  window.api:   ' + typeof window.api + '\n' +
                                '  capacitor:    ' + typeof window.Capacitor + '\n' +
                                '  serviceWorker:' + typeof navigator.serviceWorker,
                        );
                    }
                }, 5000);
            })();
        </script>
        <% } %>
        <div id="root">
            <script type="module" src="main.tsx"></script>
        </div>
    </body>
</html>
